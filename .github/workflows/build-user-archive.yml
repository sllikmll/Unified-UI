name: Build user archive

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-user-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-official-awg-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build pinned official AmneziaWG runtime
        shell: bash
        run: |
          set -euxo pipefail
          GO_TAG="v3.1.20260814"
          GO_SHA="1b86b2ae0e493e7ea93f8c1a0f0cb6735b1551f1"
          TOOLS_TAG="v3.1.20260812"
          TOOLS_SHA="ee0f0a9aa34ff0a0da4b3433b9512781cfe02843"

          rm -rf .tmp/official-awg dist-awg
          mkdir -p .tmp/official-awg dist-awg
          git clone --filter=blob:none https://github.com/amnezia-vpn/amneziawg-go.git .tmp/official-awg/amneziawg-go
          git -C .tmp/official-awg/amneziawg-go checkout --detach "$GO_TAG"
          test "$(git -C .tmp/official-awg/amneziawg-go rev-parse HEAD)" = "$GO_SHA"

          git clone --filter=blob:none https://github.com/amnezia-vpn/amneziawg-tools.git .tmp/official-awg/amneziawg-tools
          git -C .tmp/official-awg/amneziawg-tools checkout --detach "$TOOLS_TAG"
          test "$(git -C .tmp/official-awg/amneziawg-tools rev-parse HEAD)" = "$TOOLS_SHA"

          (
            cd .tmp/official-awg/amneziawg-go
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist-awg/amneziawg-go" .
          )

          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/.tmp/official-awg/amneziawg-tools/src \
            alpine:3.19 sh -euxc 'apk add --no-cache linux-headers build-base && make clean && make && cp wg /work/dist-awg/awg'

          sudo chown -R "$(id -u):$(id -g)" dist-awg
          chmod 755 dist-awg/amneziawg-go dist-awg/awg
          cat > dist-awg/OFFICIAL_AWG_PROVENANCE.json <<JSON
          {
            "amneziawg-go": {
              "repository": "https://github.com/amnezia-vpn/amneziawg-go.git",
              "tag": "$GO_TAG",
              "commit": "$GO_SHA"
            },
            "amneziawg-tools": {
              "repository": "https://github.com/amnezia-vpn/amneziawg-tools.git",
              "tag": "$TOOLS_TAG",
              "commit": "$TOOLS_SHA"
            },
            "target": "linux/arm64",
            "tools_libc": "musl (Alpine 3.19)"
          }
          JSON
          (cd dist-awg && sha256sum amneziawg-go awg > SHA256SUMS)
          file dist-awg/amneziawg-go dist-awg/awg

      - name: Upload official AWG runtime artifact
        uses: actions/upload-artifact@v6
        with:
          name: official-awg-linux-arm64
          path: dist-awg/

  build-release:
    needs: [build-official-awg-arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: tools/xk-geodat/go.sum

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Run Python tests
        run: python -m pytest -q

      - name: Verify frontend build
        run: node scripts/verify_frontend_build.mjs

      - name: Prepare package directory
        run: |
          rm -rf dist package-root
          mkdir -p dist package-root/unified-ui
          rsync -a unified-ui/ package-root/unified-ui/ \
            --exclude '__pycache__' \
            --exclude '.DS_Store'

      - name: Add official AmneziaWG arm64 runtime to package
        uses: actions/download-artifact@v7
        with:
          name: official-awg-linux-arm64
          path: package-root/unified-ui/bin

      - name: Verify bundled AmneziaWG runtime
        run: |
          chmod 755 package-root/unified-ui/bin/amneziawg-go package-root/unified-ui/bin/awg
          (cd package-root/unified-ui/bin && sha256sum -c SHA256SUMS)
          test -s package-root/unified-ui/bin/OFFICIAL_AWG_PROVENANCE.json


      - name: Write BUILD.json
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/unified-ui-routing.tar.gz"
          else
            VERSION="${GITHUB_SHA::7}"
            UPDATE_URL=""
          fi

          RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          export VERSION RELEASE_DATE UPDATE_URL

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("package-root/unified-ui/BUILD.json")
          payload = {
              "version": os.environ["VERSION"],
              "release_date": os.environ["RELEASE_DATE"],
              "update_url": os.environ["UPDATE_URL"],
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Create user archive
        run: |
          tar -czf dist/unified-ui-routing.tar.gz -C package-root unified-ui
          sha256sum dist/unified-ui-routing.tar.gz > dist/unified-ui-routing.tar.gz.sha256

      - name: Build xk-geodat binaries
        working-directory: tools/xk-geodat
        run: |
          mkdir -p ../../dist

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-arm64 \
            ./cmd/xk-geodat

          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-mips \
            ./cmd/xk-geodat

          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-mipsle \
            ./cmd/xk-geodat

      - name: Create checksums
        run: |
          sha256sum dist/unified-ui-routing.tar.gz > dist/unified-ui-routing.tar.gz.sha256
          sha256sum dist/xk-geodat-linux-arm64 > dist/xk-geodat-linux-arm64.sha256
          sha256sum dist/xk-geodat-linux-mips > dist/xk-geodat-linux-mips.sha256
          sha256sum dist/xk-geodat-linux-mipsle > dist/xk-geodat-linux-mipsle.sha256

          sha256sum \
            dist/unified-ui-routing.tar.gz \
            dist/xk-geodat-linux-arm64 \
            dist/xk-geodat-linux-mips \
            dist/xk-geodat-linux-mipsle \
            > dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            dist/unified-ui-routing.tar.gz
            dist/unified-ui-routing.tar.gz.sha256
            dist/xk-geodat-linux-arm64
            dist/xk-geodat-linux-arm64.sha256
            dist/xk-geodat-linux-mips
            dist/xk-geodat-linux-mips.sha256
            dist/xk-geodat-linux-mipsle
            dist/xk-geodat-linux-mipsle.sha256
            dist/SHA256SUMS

      - name: Ensure GitHub CLI is available
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/unified-ui-routing.tar.gz \
              dist/unified-ui-routing.tar.gz.sha256 \
              dist/xk-geodat-linux-arm64 \
              dist/xk-geodat-linux-arm64.sha256 \
              dist/xk-geodat-linux-mips \
              dist/xk-geodat-linux-mips.sha256 \
              dist/xk-geodat-linux-mipsle \
              dist/xk-geodat-linux-mipsle.sha256 \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              dist/unified-ui-routing.tar.gz \
              dist/unified-ui-routing.tar.gz.sha256 \
              dist/xk-geodat-linux-arm64 \
              dist/xk-geodat-linux-arm64.sha256 \
              dist/xk-geodat-linux-mips \
              dist/xk-geodat-linux-mips.sha256 \
              dist/xk-geodat-linux-mipsle \
              dist/xk-geodat-linux-mipsle.sha256 \
              dist/SHA256SUMS \
              --title "$TAG" \
              --generate-notes
          fi
